<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Personal Finance Management Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .auth-container {
            width: 100%;
            max-width: 480px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Logo Header -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center mb-2" style="width: 48px; height: 48px; border-radius: 12px; background: var(--primary-gradient); box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);">
                <span class="text-white fs-4 fw-bold">◆</span>
            </div>
            <h4 class="fw-bold text-white mb-1">Create Your Account</h4>
            <p class="text-light small opacity-75">Start budgeting with AI deterministic spending heuristics</p>
        </div>

        <!-- Registration Card -->
        <div class="card card-fintech shadow-lg p-4 p-md-4">
            <form id="registerForm" data-preview-handler="true" data-preview-action="Registered">
                <!-- CSRF Token Hidden Field -->
                <input type="hidden" name="csrfToken" value="preview-csrf-token-xyz123">

                <div class="mb-3">
                    <label for="regName" class="form-label-clean">Full Name</label>
                    <input type="text" class="form-control form-control-clean" id="regName" name="name" 
                           placeholder="e.g. John Doe" required>
                </div>

                <div class="mb-3">
                    <label for="regEmail" class="form-label-clean">Email Address</label>
                    <input type="email" class="form-control form-control-clean" id="regEmail" name="email" 
                           placeholder="john@example.com" required>
                    <div class="form-text small text-muted">We will never share your personal email.</div>
                </div>

                <div class="mb-3">
                    <label for="regPassword" class="form-label-clean">Password (Min. 8 characters)</label>
                    <input type="password" class="form-control form-control-clean" id="regPassword" name="password" 
                           placeholder="••••••••" minlength="8" required>
                </div>

                <div class="mb-3">
                    <label for="regConfirmPassword" class="form-label-clean">Confirm Password</label>
                    <input type="password" class="form-control form-control-clean" id="regConfirmPassword" name="confirmPassword" 
                           placeholder="••••••••" minlength="8" required>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="termsCheck" required checked>
                    <label class="form-check-label small text-muted" for="termsCheck">
                        I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> &amp; Security Policy
                    </label>
                </div>

                <button type="submit" class="btn btn-indigo w-100 py-2 fw-semibold">Complete Registration →</button>
            </form>

            <div class="text-center mt-3 pt-3 border-top small text-muted">
                Already registered? 
                <a href="login.html" class="fw-semibold text-decoration-none" style="color: var(--primary-indigo);">Sign In here</a>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="index.html" class="text-light small opacity-75 text-decoration-none">← Back to Preview Index</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/charts.js"></script>
</body>
</html>
